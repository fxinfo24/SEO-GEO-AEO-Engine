name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real PostgreSQL for tests/storage — no mocks, no external account.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Fail (don't skip) if the database is ever unreachable, so a broken
      # service container can't turn the storage suite into a silent no-op.
      REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      # Python 3.12: the version this project is developed and tested on.
      # 3.14 was broken by a since-removed dependency (pydantic-core via
      # supabase) and has not been re-tested — see README "Install".
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: Mypy (types)
        run: mypy src

      - name: pytest
        run: pytest -v --cov=seo_geo_aeo --cov-report=term-missing

  # Phase 10: secret scanning. Scans full history (fetch-depth: 0), not just the
  # latest commit, since a leaked key stays leaked after a "remove secret" commit.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
