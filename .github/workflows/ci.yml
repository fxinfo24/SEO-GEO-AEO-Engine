name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.12, not 3.14: pydantic-core (a Supabase dependency) has no
      # 3.14 wheel yet and falls back to a Rust source build that hangs.
      # See README "Install" section — this cost real debugging time once.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/ tests/
        continue-on-error: true  # not clean yet; visible, not blocking

      - name: pytest
        run: pytest -v --cov=seo_geo_aeo --cov-report=term-missing
